name: GitHub Pages

on:
  # auto deploy when pushing to specified branches.
  push:
    branches:
      - main

  # allow deploying manually.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned: latest (v0.166+) pulls hugomods/search v0.20+ which needs
          # the fuse.js npm module absent from package.json. Local builds use
          # 0.124.1 with modules locked in go.mod / go.sum.
          hugo-version: "0.124.1"
          extended: true

      - name: Setup Dart Sass
        run: |
          sudo snap install dart-sass

      - name: Install Node.js dependencies
        run: npm ci

      # Modules are locked in go.mod / go.sum: build with pinned versions
      # for reproducible CI. Run `hugo mod get -u` manually to upgrade,
      # then verify the build locally before pushing.

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
